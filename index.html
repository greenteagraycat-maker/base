<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMDb ClipVault</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc, serverTimestamp, query, orderBy } 
           from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Config ของคุณ
    const firebaseConfig = {
      apiKey: "AIzaSyC9yqqSj3tJ0KjXMnhlhm2b4_ukely11wA",
      authDomain: "my-image-library-b67bc.firebaseapp.com",
      databaseURL: "https://my-image-library-b67bc-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "my-image-library-b67bc",
      storageBucket: "my-image-library-b67bc.firebasestorage.app",
      messagingSenderId: "617200510653",
      appId: "1:617200510653:web:7fa22b460bbdec7f0b79d4",
      measurementId: "G-Q60YG2EB3B"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "clips");

    let currentImageBase64 = null;
    let editDocId = null;

    // ฟังก์ชันย่อภาพให้อัตโนมัติ เซฟรูปได้ไวและไม่หนักดาต้าเบส
    function compressImage(base64Str, maxWidth = 900, quality = 0.75) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = base64Str;
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
      });
    }

    // Realtime Listener: ข้อมูลซิงค์ตรงกันทันทีทั้งบนคอมและมือถือ
    const q = query(colRef, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const grid = document.getElementById("clipsGrid");
      const emptyState = document.getElementById("emptyState");
      grid.innerHTML = "";

      if (snapshot.empty) {
        emptyState.classList.remove("hidden");
        return;
      }
      emptyState.classList.add("hidden");

      snapshot.forEach((docSnap) => {
        const item = { id: docSnap.id, ...docSnap.data() };
        grid.appendChild(createCardElement(item));
      });
    }, (error) => {
      console.error("Firestore error:", error);
    });

    // ดักจับการกด Ctrl + V จากคีย์บอร์ด
    window.addEventListener("paste", (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      const items = e.clipboardData?.items;
      if (!items) return;

      for (let item of items) {
        if (item.type.indexOf("image") !== -1) {
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = async (event) => {
            currentImageBase64 = await compressImage(event.target.result);
            openModal(null, currentImageBase64);
            Swal.fire({
              toast: true,
              position: 'top-end',
              icon: 'success',
              title: 'ตรวจพบภาพจาก Clipboard แล้ว!',
              showConfirmButton: false,
              timer: 1600
            });
          };
          reader.readAsDataURL(blob);
          break;
        }
      }
    });

    // บันทึก / อัปเดตข้อมูล
    window.saveClip = async function () {
      const title = document.getElementById("modalTitleInput").value.trim();
      const description = document.getElementById("modalDescInput").value.trim();
      const rating = document.getElementById("modalRatingInput").value || "8.5";

      if (!title) {
        Swal.fire({ icon: 'warning', title: 'กรุณากรอกหัวข้อ', text: 'ต้องมีชื่อหัวข้ออย่างน้อย 1 รายการ' });
        return;
      }
      if (!currentImageBase64 && !editDocId) {
        Swal.fire({ icon: 'warning', title: 'ยังไม่มีรูปภาพ', text: 'กรุณาแคปแล้ว Ctrl+V หรือเลือกรูปภาพ' });
        return;
      }

      Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      try {
        if (editDocId) {
          const updateData = { title, description, rating, updatedAt: serverTimestamp() };
          if (currentImageBase64) updateData.imageUrl = currentImageBase64;
          await updateDoc(doc(db, "clips", editDocId), updateData);
        } else {
          await addDoc(colRef, {
            title,
            description,
            rating,
            imageUrl: currentImageBase64,
            createdAt: serverTimestamp()
          });
        }

        closeModal();
        Swal.fire({ icon: 'success', title: 'สำเร็จ!', timer: 1500, showConfirmButton: false });
      } catch (err) {
        console.error(err);
        Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message });
      }
    };

    // ลบข้อมูล
    window.deleteClip = async function (id, title) {
      const confirm = await Swal.fire({
        title: `ต้องการลบรายการนี้?`,
        text: title,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#e50914',
        cancelButtonColor: '#2b2b2b',
        confirmButtonText: 'ลบเลย',
        cancelButtonText: 'ยกเลิก'
      });

      if (confirm.isConfirmed) {
        await deleteDoc(doc(db, "clips", id));
        Swal.fire({ icon: 'success', title: 'ลบเรียบร้อย', timer: 1200, showConfirmButton: false });
      }
    };

    window.openModal = function (item = null, pastedImg = null) {
      const modal = document.getElementById("entryModal");
      const titleInput = document.getElementById("modalTitleInput");
      const descInput = document.getElementById("modalDescInput");
      const ratingInput = document.getElementById("modalRatingInput");
      const previewImg = document.getElementById("modalPreviewImg");
      const modalHeader = document.getElementById("modalHeader");

      if (item) {
        editDocId = item.id;
        currentImageBase64 = null;
        modalHeader.innerText = "แก้ไขข้อมูล";
        titleInput.value = item.title || "";
        descInput.value = item.description || "";
        ratingInput.value = item.rating || "8.5";
        previewImg.src = item.imageUrl;
        previewImg.classList.remove("hidden");
      } else {
        editDocId = null;
        modalHeader.innerText = "บันทึกภาพใหม่";
        titleInput.value = "";
        descInput.value = "";
        ratingInput.value = "8.5";
        if (pastedImg) {
          previewImg.src = pastedImg;
          previewImg.classList.remove("hidden");
        } else {
          previewImg.src = "";
          previewImg.classList.add("hidden");
        }
      }
      modal.classList.remove("hidden");
    };

    window.closeModal = function () {
      document.getElementById("entryModal").classList.add("hidden");
      currentImageBase64 = null;
      editDocId = null;
    };

    function createCardElement(item) {
      const div = document.createElement("div");
      div.className = "bg-[#1a1a1a] rounded-lg overflow-hidden border border-[#2a2a2a] flex flex-col hover:border-[#f5c518] transition group shadow-md";
      div.innerHTML = `
        <div class="relative aspect-[2/3] bg-[#0c0c0c] overflow-hidden">
          <img src="${item.imageUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          <div class="absolute top-2 left-2 bg-black/80 px-2 py-0.5 rounded text-xs text-[#f5c518] font-bold flex items-center gap-1 backdrop-blur-sm">
            <i class="fa-solid fa-star text-[10px]"></i> ${item.rating || '8.5'}
          </div>
        </div>
        <div class="p-3 flex-1 flex flex-col justify-between">
          <div>
            <h3 class="font-bold text-white text-sm line-clamp-1 group-hover:text-[#f5c518] transition">${item.title}</h3>
            <p class="text-xs text-neutral-400 mt-1 line-clamp-2">${item.description || '-'}</p>
          </div>
          <div class="flex items-center justify-between border-t border-[#262626] pt-2.5 mt-3">
            <button onclick='openModal(${JSON.stringify(item)})' class="text-xs text-neutral-300 hover:text-white px-2 py-1 rounded hover:bg-neutral-800 transition">
              <i class="fa-solid fa-pen-to-square mr-1"></i>แก้ไข
            </button>
            <button onclick='deleteClip("${item.id}", "${item.title}")' class="text-xs text-red-400 hover:text-red-300 px-2 py-1 rounded hover:bg-red-950/40 transition">
              <i class="fa-solid fa-trash-can mr-1"></i>ลบ
            </button>
          </div>
        </div>
      `;
      return div;
    }

    // อัปโหลดผ่านมือถือ
    document.getElementById("mobileFileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = async (evt) => {
          currentImageBase64 = await compressImage(evt.target.result);
          openModal(null, currentImageBase64);
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</head>

<body class="bg-[#121212] text-white min-h-screen flex flex-col font-sans">
  <!-- Navbar สไตล์ IMDb -->
  <header class="bg-[#1f1f1f] border-b border-[#2d2d2d] sticky top-0 z-30 px-4 py-2.5 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-3">
      <div class="bg-[#f5c518] text-black font-black px-2.5 py-1 rounded text-base tracking-tighter">
        CLIP<span class="text-neutral-900">Db</span>
      </div>
      <span class="text-xs text-neutral-400 hidden sm:inline">กด <kbd class="bg-neutral-800 px-1 py-0.5 rounded text-neutral-200">Win+Shift+S</kbd> แล้วกด <kbd class="bg-neutral-800 px-1 py-0.5 rounded text-neutral-200">Ctrl+V</kbd> ได้เลย</span>
    </div>
    <div class="flex items-center gap-2">
      <label for="mobileFileInput" class="sm:hidden cursor-pointer bg-[#2a2a2a] text-[#f5c518] px-3 py-1.5 rounded text-xs font-semibold flex items-center gap-1.5">
        <i class="fa-solid fa-camera"></i> เลือกรูป
      </label>
      <input type="file" id="mobileFileInput" accept="image/*" class="hidden">
      <button onclick="openModal()" class="bg-[#f5c518] hover:bg-[#e2b616] text-black text-xs font-bold px-3.5 py-1.5 rounded transition flex items-center gap-1.5">
        <i class="fa-solid fa-plus"></i> เพิ่มใหม่
      </button>
    </div>
  </header>

  <!-- รายการการ์ดรูปภาพ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
    <div id="clipsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4"></div>
    <div id="emptyState" class="hidden text-center py-20">
      <i class="fa-solid fa-film text-5xl text-neutral-600 mb-3"></i>
      <h3 class="text-lg font-bold text-neutral-400">ยังไม่มีรายการบันทึก</h3>
      <p class="text-xs text-neutral-500 mt-1">แคปภาพหน้าจอแล้วกด Ctrl + V เพื่อบันทึกรูปแรก</p>
    </div>
  </main>

  <!-- Modal ป็อปอัป -->
  <div id="entryModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[#1f1f1f] border border-[#333] w-full max-w-md rounded-xl overflow-hidden shadow-2xl flex flex-col">
      <div class="p-4 border-b border-[#2c2c2c] flex items-center justify-between">
        <h2 id="modalHeader" class="text-base font-bold text-[#f5c518]">บันทึกภาพใหม่</h2>
        <button onclick="closeModal()" class="text-neutral-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="p-4 space-y-3.5 overflow-y-auto max-h-[75vh]">
        <div class="w-full flex justify-center bg-black/50 rounded-lg p-2 border border-[#2b2b2b]">
          <img id="modalPreviewImg" class="max-h-56 object-contain rounded" src="" alt="Preview">
        </div>
        <div>
          <label class="block text-xs text-neutral-400 font-semibold mb-1">หัวข้อหลัก (Title) *</label>
          <input type="text" id="modalTitleInput" placeholder="ใส่หัวข้อ..." class="w-full bg-[#121212] border border-[#333] rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-[#f5c518]">
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div class="col-span-2">
            <label class="block text-xs text-neutral-400 font-semibold mb-1">รายละเอียด (Description)</label>
            <textarea id="modalDescInput" rows="2" placeholder="โน้ตเพิ่มเติม..." class="w-full bg-[#121212] border border-[#333] rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-[#f5c518]"></textarea>
          </div>
          <div>
            <label class="block text-xs text-neutral-400 font-semibold mb-1">คะแนน (Rating)</label>
            <input type="number" step="0.1" min="1" max="10" id="modalRatingInput" value="8.5" class="w-full bg-[#121212] border border-[#333] rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-[#f5c518]">
          </div>
        </div>
      </div>
      <div class="p-4 border-t border-[#2c2c2c] bg-[#1a1a1a] flex justify-end gap-2">
        <button onclick="closeModal()" class="px-4 py-2 rounded text-xs font-semibold text-neutral-300 hover:bg-neutral-800 transition">ยกเลิก</button>
        <button onclick="saveClip()" class="px-5 py-2 bg-[#f5c518] hover:bg-[#e2b616] text-black rounded text-xs font-bold transition">บันทึกข้อมูล</button>
      </div>
    </div>
  </div>
</body>
</html>
