<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Web-base</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .navbar {
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }
    .card-clean {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      transition: all 0.2s ease-in-out;
      background: #ffffff;
    }
    .card-clean:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      border-color: #cbd5e1;
    }
    .img-preview-box {
      background-color: #f1f5f9;
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .badge-soft {
      background-color: #e0f2fe;
      color: #0284c7;
      font-weight: 600;
    }
    kbd {
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.75rem;
    }
  </style>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc, serverTimestamp, query, orderBy } 
           from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC9yqqSj3tJ0KjXMnhlhm2b4_ukely11wA",
      authDomain: "my-image-library-b67bc.firebaseapp.com",
      databaseURL: "https://my-image-library-b67bc-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "my-image-library-b67bc",
      storageBucket: "my-image-library-b67bc.firebasestorage.app",
      messagingSenderId: "617200510653",
      appId: "1:617200510653:web:7fa22b460bbdec7f0b79d4",
      measurementId: "G-Q60YG2EB3B"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "clips");

    let currentImageBase64 = null;
    let editDocId = null;
    let rawClips = [];

    // ย่อขนาดรูปภาพให้โหลดเร็วและบันทึกราบรื่น
    function compressImage(base64Str, maxWidth = 1000, quality = 0.75) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = base64Str;
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
      });
    }

    // Modal Instance
    let bsModal = null;
    window.addEventListener('DOMContentLoaded', () => {
      bsModal = new bootstrap.Modal(document.getElementById('entryModal'));
    });

    // Realtime Listener
    const q = query(colRef, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      rawClips = [];
      snapshot.forEach((docSnap) => {
        rawClips.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderCards(rawClips);
    }, (error) => {
      console.error(error);
      Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: error.message });
    });

    // แสดงผล Cards
    function renderCards(items) {
      const grid = document.getElementById("clipsGrid");
      const emptyState = document.getElementById("emptyState");
      const countEl = document.getElementById("totalCount");
      grid.innerHTML = "";
      countEl.innerText = `${items.length} รายการ`;

      if (items.length === 0) {
        emptyState.classList.remove("d-none");
        return;
      }
      emptyState.classList.add("d-none");

      items.forEach((item) => {
        const col = document.createElement("div");
        col.className = "col-12 col-sm-6 col-md-4 col-lg-3";

        const dateStr = item.createdAt?.seconds 
          ? new Date(item.createdAt.seconds * 1000).toLocaleDateString('th-TH') 
          : 'เมื่อสักครู่';

        col.innerHTML = `
          <div class="card card-clean h-100 shadow-sm overflow-hidden">
            <div class="position-relative bg-light" style="height: 190px;">
              <img src="${item.imageUrl}" class="w-100 h-100 object-fit-cover" alt="${item.title}">
              <span class="position-absolute top-0 end-0 m-2 badge bg-white text-dark shadow-sm border">
                <i class="bi bi-star-fill text-warning me-1"></i>${item.rating || '8.5'}
              </span>
            </div>
            <div class="card-body d-flex flex-column p-3">
              <h6 class="card-title fw-bold text-truncate mb-1" title="${item.title}">${item.title}</h6>
              <p class="card-text text-muted small flex-grow-1 mb-3" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                ${item.description || 'ไม่มีรายละเอียด'}
              </p>
              <div class="d-flex align-items-center justify-content-between pt-2 border-top">
                <span class="text-secondary" style="font-size: 0.75rem;"><i class="bi bi-clock me-1"></i>${dateStr}</span>
                <div>
                  <button onclick='editClip(${JSON.stringify(item)})' class="btn btn-sm btn-outline-secondary me-1 py-1 px-2 border-0">
                    <i class="bi bi-pencil-square"></i>
                  </button>
                  <button onclick='deleteClip("${item.id}", "${item.title}")' class="btn btn-sm btn-outline-danger py-1 px-2 border-0">
                    <i class="bi bi-trash3"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(col);
      });
    }

    // ค้นหาข้อความ
    window.handleSearch = function(queryStr) {
      const term = queryStr.toLowerCase().trim();
      const filtered = rawClips.filter(c => 
        (c.title && c.title.toLowerCase().includes(term)) || 
        (c.description && c.description.toLowerCase().includes(term))
      );
      renderCards(filtered);
    };

    // ตรวจจับการกด Ctrl + V
    window.addEventListener("paste", (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      const items = e.clipboardData?.items;
      if (!items) return;

      for (let item of items) {
        if (item.type.indexOf("image") !== -1) {
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = async (event) => {
            currentImageBase64 = await compressImage(event.target.result);
            openCreateModal(currentImageBase64);
            Swal.fire({
              toast: true,
              position: 'top-end',
              icon: 'success',
              title: 'ตรวจพบภาพที่แคปแล้ว!',
              showConfirmButton: false,
              timer: 1600
            });
          };
          reader.readAsDataURL(blob);
          break;
        }
      }
    });

    // บันทึก / แก้ไข
    window.saveClip = async function () {
      const title = document.getElementById("modalTitleInput").value.trim();
      const description = document.getElementById("modalDescInput").value.trim();
      const rating = document.getElementById("modalRatingInput").value || "8.5";

      if (!title) {
        Swal.fire({ icon: 'warning', title: 'กรุณากรอกหัวข้อ' });
        return;
      }
      if (!currentImageBase64 && !editDocId) {
        Swal.fire({ icon: 'warning', title: 'ยังไม่มีรูปภาพ', text: 'กรุณาแคปแล้ว Ctrl+V หรือเลือกรูปภาพ' });
        return;
      }

      Swal.fire({
        title: 'กำลังบันทึกข้อมูล...',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      try {
        if (editDocId) {
          const updateData = { title, description, rating, updatedAt: serverTimestamp() };
          if (currentImageBase64) updateData.imageUrl = currentImageBase64;
          await updateDoc(doc(db, "clips", editDocId), updateData);
        } else {
          await addDoc(colRef, {
            title,
            description,
            rating,
            imageUrl: currentImageBase64,
            createdAt: serverTimestamp()
          });
        }

        bsModal.hide();
        Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', timer: 1400, showConfirmButton: false });
      } catch (err) {
        console.error(err);
        Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message });
      }
    };

    // ลบ
    window.deleteClip = async function (id, title) {
      const res = await Swal.fire({
        title: 'ต้องการลบรายการนี้?',
        text: `คุณกำลังจะลบ "${title}"`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#dc3545',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'ใช่, ลบเลย',
        cancelButtonText: 'ยกเลิก'
      });

      if (res.isConfirmed) {
        await deleteDoc(doc(db, "clips", id));
        Swal.fire({ icon: 'success', title: 'ลบเรียบร้อย', timer: 1200, showConfirmButton: false });
      }
    };

    // Modal Handlers
    window.openCreateModal = function (pastedImg = null) {
      editDocId = null;
      document.getElementById("modalHeaderTitle").innerText = "บันทึกภาพใหม่";
      document.getElementById("modalTitleInput").value = "";
      document.getElementById("modalDescInput").value = "";
      document.getElementById("modalRatingInput").value = "8.5";

      const preview = document.getElementById("modalPreviewImg");
      const placeholder = document.getElementById("previewPlaceholder");

      if (pastedImg) {
        currentImageBase64 = pastedImg;
        preview.src = pastedImg;
        preview.classList.remove("d-none");
        placeholder.classList.add("d-none");
      } else {
        currentImageBase64 = null;
        preview.src = "";
        preview.classList.add("d-none");
        placeholder.classList.remove("d-none");
      }
      bsModal.show();
    };

    window.editClip = function (item) {
      editDocId = item.id;
      currentImageBase64 = null;
      document.getElementById("modalHeaderTitle").innerText = "แก้ไขข้อมูล";
      document.getElementById("modalTitleInput").value = item.title || "";
      document.getElementById("modalDescInput").value = item.description || "";
      document.getElementById("modalRatingInput").value = item.rating || "8.5";

      const preview = document.getElementById("modalPreviewImg");
      const placeholder = document.getElementById("previewPlaceholder");
      preview.src = item.imageUrl;
      preview.classList.remove("d-none");
      placeholder.classList.add("d-none");

      bsModal.show();
    };

    // มือถือเลือกไฟล์
    document.getElementById("mobileFileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = async (evt) => {
          currentImageBase64 = await compressImage(evt.target.result);
          openCreateModal(currentImageBase64);
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top py-2.5">
    <div class="container-fluid max-w-7xl px-3 px-md-4">
      <a class="navbar-brand fw-bold text-dark d-flex align-items-center gap-2 m-0" href="#">
        <div class="bg-primary text-white rounded-3 px-2 py-1 fs-6 d-inline-flex align-items-center">
          <i class="bi bi-collection-fill"></i>
        </div>
        <span>My Web-base</span>
      </a>

      <!-- Search Box กลาง Navbar -->
      <div class="mx-auto my-2 my-lg-0 col-12 col-md-5 col-lg-4 px-lg-2">
        <div class="input-group input-group-sm">
          <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
          <input type="text" oninput="handleSearch(this.value)" class="form-control border-start-0 ps-0" placeholder="ค้นหาบันทึก...">
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="d-flex align-items-center gap-2">
        <label for="mobileFileInput" class="btn btn-sm btn-outline-secondary d-md-none m-0">
          <i class="bi bi-camera"></i> รูป
        </label>
        <input type="file" id="mobileFileInput" accept="image/*" class="d-none">

        <button onclick="openCreateModal()" class="btn btn-sm btn-primary fw-semibold px-3 py-1.5 shadow-sm rounded-3">
          <i class="bi bi-plus-lg me-1"></i> เพิ่มข้อมูล
        </button>
      </div>
    </div>
  </nav>

  <!-- Tip Banner สไตล์ Minimal -->
  <div class="bg-white border-bottom py-2">
    <div class="container-fluid px-3 px-md-4 d-flex justify-content-between align-items-center small text-muted">
      <div>
        <i class="bi bi-lightning-charge-fill text-warning me-1"></i>
        แคปภาพด้วย <kbd>Win + Shift + S</kbd> แล้วคลิกหน้าเว็บกด <kbd>Ctrl + V</kbd> ได้ทันที
      </div>
      <div id="totalCount" class="fw-semibold text-secondary">0 รายการ</div>
    </div>
  </div>

  <!-- Content Grid -->
  <main class="container-fluid px-3 px-md-4 py-4">
    <div id="clipsGrid" class="row g-3 g-md-4"></div>

    <!-- Empty State -->
    <div id="emptyState" class="d-none text-center py-5">
      <div class="display-6 text-muted mb-2"><i class="bi bi-inbox"></i></div>
      <h6 class="fw-bold text-secondary">ยังไม่มีข้อมูลในระบบ</h6>
      <p class="text-muted small">แคปรูปหน้าจอแล้วกด Ctrl + V หรือกดปุ่มเพิ่มข้อมูลเพื่อเริ่มต้น</p>
    </div>
  </main>

  <!-- Modal Bootstrap 5 (Clean Design) -->
  <div class="modal fade" id="entryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="modal-header bg-light border-bottom py-3">
          <h6 class="modal-title fw-bold text-dark" id="modalHeaderTitle">บันทึกภาพใหม่</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <!-- Image Box -->
          <div class="img-preview-box mb-3 position-relative">
            <img id="modalPreviewImg" src="" alt="Preview" class="d-none w-100 object-fit-contain" style="max-height: 240px;">
            <div id="previewPlaceholder" class="text-center text-muted p-4">
              <i class="bi bi-card-image fs-1 d-block mb-1 text-secondary"></i>
              <span class="small">กด Ctrl+V ที่หน้าเว็บ หรือเลือกไฟล์รูป</span>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">หัวข้อหลัก *</label>
            <input type="text" id="modalTitleInput" class="form-control" placeholder="เช่น รายละเอียดงาน ตอนที่ 1...">
          </div>

          <div class="row g-2 mb-2">
            <div class="col-8">
              <label class="form-label small fw-semibold text-secondary">รายละเอียดเพิ่มเติม</label>
              <textarea id="modalDescInput" rows="2" class="form-control" placeholder="ข้อความหรือโน้ตย่อย..."></textarea>
            </div>
            <div class="col-4">
              <label class="form-label small fw-semibold text-secondary">คะแนน/แท็ก</label>
              <input type="number" step="0.1" min="1" max="10" id="modalRatingInput" value="8.5" class="form-control">
            </div>
          </div>
        </div>
        <div class="modal-footer bg-light border-top py-2 px-3">
          <button type="button" class="btn btn-sm btn-light border" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="button" onclick="saveClip()" class="btn btn-sm btn-primary px-3 fw-semibold">บันทึกข้อมูล</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
